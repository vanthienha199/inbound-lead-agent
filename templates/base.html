<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Studio Lind, inbound leads{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="bar">
  <h1>Studio Lind<small>Inbound leads, internal</small></h1>
  <nav>
    <a href="/" class="{{ 'on' if page=='leads' }}">Leads{% if waiting %} <span>{{ waiting|length }}</span>{% endif %}</a>
    <a href="/activity" class="{{ 'on' if page=='activity' }}">Activity</a>
    <a href="/tools" class="{{ 'on' if page=='tools' }}">Tools</a>
  </nav>
</header>

<main class="{% block mainclass %}{% endblock %}">{% block body %}{% endblock %}</main>

<footer class="foot">Fictional business, invented data.</footer>
{% block script %}{% endblock %}
</body>
</html>
